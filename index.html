<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182638;background:#f2f5fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #82adf1;outline-offset:2px}.top{background:linear-gradient(145deg,#183b7a,#2859aa);color:white;padding:22px max(18px,env(safe-area-inset-right)) 21px;}.shell{max-width:960px;margin:auto}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:850;letter-spacing:-.5px}.mark{width:34px;height:34px;display:grid;place-items:center;background:#ffffff26;border:1px solid #ffffff33;border-radius:11px;font-size:23px}.live-dot{width:8px;height:8px;border-radius:50%;background:#72e1ad;box-shadow:0 0 0 3px #ffffff1c}.top-status{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;white-space:nowrap}.comp{margin:19px 0 4px;font-size:24px;font-weight:850;letter-spacing:-.7px;line-height:1.2}.sub{color:#d3e2fb;font-size:12px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#ffffff16;border:1px solid #ffffff26;border-radius:12px;padding:11px 8px;text-align:center}.stat strong{display:block;font-size:21px}.stat strong.stat-round-value{font-size:clamp(11px,2.8vw,18px);line-height:1.35;white-space:nowrap;letter-spacing:-.025em}.stat small{color:#dce7ff;font-size:10px;line-height:1.35;display:block}.stat small .stat-subnote{display:block;font-size:9px;opacity:.95;margin-top:2px}main{max-width:960px;margin:auto;padding:17px 14px 95px}.searchbox{position:relative;background:#fff;border:1px solid #dbe4f2;border-radius:14px;box-shadow:0 5px 20px #19365a0a;display:flex;align-items:center;gap:9px;padding:4px 11px}.searchbox svg{color:#627991;flex:none}.searchbox input{border:none;outline:none!important;min-width:0;width:100%;height:42px;background:transparent;color:#192b42;font-size:14px}.search-results{background:#fff;border-radius:13px;border:1px solid #dce4ee;overflow:hidden;margin-top:6px;box-shadow:0 12px 22px #1b35511a}.search-hit{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:0;border-bottom:1px solid #eaf0f6;padding:12px;text-align:left;color:#233c5c}.search-hit:last-child{border:0}.search-hit-actions{display:flex;align-items:center;gap:6px;flex:none}.search-action{border:1px solid #cbdaf0;border-radius:9px;background:#f1f6ff;color:#244e9b;font-size:11px;font-weight:800;padding:8px 10px;white-space:nowrap}.search-action.go{background:#244e9b;color:#fff;border-color:#244e9b}.search-hit-info{min-width:0;overflow-wrap:anywhere}.search-hit:hover{background:#f2f7ff}.search-hit small{display:block;color:#6d7d90;margin-top:3px}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:white;border:1px solid #dce5f1;border-radius:14px;padding:5px;margin-top:15px}.nav button{border:0;border-radius:10px;padding:11px 2px;background:transparent;color:#65778b;font-size:12px;font-weight:750}.nav button.active{color:#214f98;background:#e8f0ff}.panel{margin-top:20px}.panel h2{font-size:19px;margin:0 0 12px;letter-spacing:-.45px}.overline{font-size:11px;color:#698097;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 7px;scrollbar-width:thin}.tabs button{white-space:nowrap;flex:none;background:#fff;border:1px solid #d6e1ee;border-radius:999px;padding:9px 13px;color:#425774;font-size:12px;font-weight:750}.tabs button.selected{color:white;background:#244e9b;border-color:#244e9b}.section-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 12px}.section-header h3{margin:0;font-size:15px}.muted{font-size:12px;color:#718094}.list{display:grid;gap:10px}.match{background:white;border:1px solid #dce5ee;border-radius:15px;padding:13px 14px;box-shadow:0 3px 13px #23375108}.match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:10px}.terrain{display:flex;align-items:center;gap:5px;color:#58708b;font-size:11px;font-weight:750}.badge{display:inline-block;border-radius:999px;padding:5px 8px;background:#eef1f7;color:#5b7086;font-size:10px;font-weight:800;white-space:nowrap}.badge.done{background:#e1f6ec;color:#196746}.badge.wait{background:#fff1d6;color:#926400}.badge.ready{background:#ffe1f3;color:#a01867}.teamline{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:37px}.team-link{background:none;border:0;text-align:left;color:#203855;font-size:13px;font-weight:730;padding:7px 0;flex:1;min-width:0;overflow-wrap:anywhere}.team-link:hover{text-decoration:underline;color:#244e9b}.team-link:disabled{color:#8995a3;cursor:default;text-decoration:none}.score{min-width:35px;text-align:center;font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}.winner{color:#156844}.teamsep{border:0;border-top:1px solid #edf1f5;margin:2px 0}.rankcard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #dce5ee;border-radius:13px;background:white;padding:12px;color:#203855}.ranknum{flex:none;width:35px;height:35px;border-radius:10px;display:grid;place-items:center;background:#edf3fb;color:#244e9b;font-weight:850}.rankname{flex:1;min-width:0;font-size:13px;font-weight:730;overflow-wrap:anywhere}.rankname small{display:block;margin-top:4px;color:#74859a;font-weight:450;font-size:11px}.rankstat{font-size:13px;font-weight:850;white-space:nowrap;text-align:right}.rankstat small{display:block;color:#8290a0;font-weight:500;font-size:11px}.empty{border:1px dashed #c6d6e8;background:#fff;border-radius:14px;padding:24px 16px;text-align:center;color:#667e95;font-size:13px;line-height:1.6}.detail-back{border:0;background:transparent;color:#24549c;font-weight:750;padding:5px 0 15px}.detail-hero{background:#fff;border:1px solid #dce5f1;border-radius:16px;padding:18px}.detail-hero h2{margin:10px 0 7px;font-size:20px;overflow-wrap:anywhere}.detail-hero p{font-size:12px;color:#708198;line-height:1.6}.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 19px}.detail-stats>div{background:white;border:1px solid #dae5f0;border-radius:12px;text-align:center;padding:12px 4px}.detail-stats strong{display:block;font-size:21px}.detail-stats small{font-size:10px;color:#6d8094}.detail-section{font-size:16px;margin:20px 0 10px}.foot{text-align:center;font-size:11px;color:#7b8b9b;margin:22px 0}.refresh{border:0;background:#e7effe;color:#244e9b;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:750}.msg{background:#fff;border:1px solid #e1e8f2;border-radius:14px;padding:20px;line-height:1.7;font-size:13px;color:#586f87}.hide{display:none!important}@media(min-width:720px){.top{padding:30px 24px}.comp{font-size:31px}.stats{max-width:510px}.desktop{display:grid;grid-template-columns:1fr;gap:12px}main{padding:23px 25px 90px}.list.matches{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{max-width:600px}.match{padding:15px 17px}}@media(max-width:350px){.nav button{font-size:10px}.comp{font-size:21px}.top-status{font-size:10px}}
/* Classement au format du logiciel de gestion, sans D ni Ex. */
.ranking-scroll{overflow-x:auto;max-width:100%;border:1px solid #dce1dc;border-radius:12px;background:#fff;-webkit-overflow-scrolling:touch;margin-top:13px}
.ranking-table{width:100%;min-width:875px;border-collapse:collapse;background:#fff;color:#142019;font-size:12px}
.ranking-table th{position:static;background:#f3f5f1;text-transform:uppercase;letter-spacing:.075em;color:#59645b;font-size:10px;text-align:left;padding:12px 11px;white-space:nowrap}
.ranking-table td{border-top:1px solid #e9ece8;padding:11px;vertical-align:middle;white-space:nowrap}
.ranking-table td.ranking-team{min-width:310px;white-space:normal}.ranking-team-button{display:grid;gap:4px;text-align:left;border:0;background:transparent;padding:2px 0;color:#142019;font-size:12px;line-height:1.4;width:100%}.ranking-team-button strong{color:#244e9b;font-size:12px}.ranking-team-button:hover strong{text-decoration:underline}.ranking-team-button span{font-size:11px}
.ranking-table .ranking-club{min-width:92px;width:105px;max-width:105px;white-space:normal;padding-left:8px;padding-right:8px}.ranking-club-text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;word-break:normal;line-height:1.15;font-size:11px;max-width:100%}.ranking-club-text.club-long{font-size:9px}.ranking-club-text.club-very-long{font-size:8px}.ranking-number{text-align:center;font-variant-numeric:tabular-nums}.ranking-wins{font-weight:850}.rank-medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ecefeb;font-weight:750}.ranking-note{font-size:12px;line-height:1.6;color:#61758d;margin-top:10px}.detail-composition{margin-top:14px;border-top:1px solid #e4eaf2;padding-top:12px}.detail-composition strong{font-size:13px;color:#244e9b}.detail-composition ul{margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.8}.detail-composition p{margin:7px 0 0}.team-directory{display:grid;gap:10px}.team-entry{background:#fff;border:1px solid #dce5ee;border-radius:14px;padding:13px 14px}.team-entry-header{display:flex;justify-content:space-between;align-items:start;gap:12px}.team-entry strong{color:#244e9b;font-size:13px}.team-entry p{margin:7px 0;font-size:12px;line-height:1.55;overflow-wrap:anywhere}.team-entry-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.match.focus-match{border:2px solid #244e9b;box-shadow:0 0 0 3px #b6cdf8,0 5px 20px #244e9b22}.search-match-note{font-size:12px;color:#244e9b;font-weight:750;margin:5px 0 10px}@media(max-width:400px){.nav button{font-size:10px;padding:11px 1px}.search-hit{flex-wrap:wrap}.search-hit-actions{margin-left:auto}}
.badge.absent{background:#fbeae8;color:#a33a35}

/* Chronomètre public */
.live-timer{margin-top:12px;background:#ffffff15;border:1px solid #ffffff35;border-radius:13px;padding:12px 14px;color:white;display:grid;gap:7px}
.live-timer[hidden]{display:none!important}.live-timer-header{display:flex;align-items:center;justify-content:space-between;gap:9px}
.live-timer-label{font-size:12px;font-weight:850;letter-spacing:.03em}.live-timer-state{font-size:10px;font-weight:800;background:#ffffff2c;border-radius:100px;padding:4px 9px}.live-timer-state.elapsed{background:#b92f3b;color:#fff}
.live-timer-clock{font-size:31px;font-weight:900;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}.live-timer-bar{height:6px;background:#ffffff30;border-radius:20px;overflow:hidden}.live-timer-fill{height:100%;background:#8bdcc5;width:0%;transition:width .5s linear}
/* Score gagnant sur fond bleu, dans les listes des tours et des phases finales */
.score.score-victory{background:#244e9b;color:#fff;padding:5px 8px;border-radius:8px;min-width:37px}
/* Fiche équipe : scores présentés du point de vue de l'équipe sélectionnée */
.detail-score{display:inline-block;white-space:nowrap;border-radius:9px;padding:7px 10px;font-size:16px;font-weight:850;font-variant-numeric:tabular-nums;color:#33485f}
.detail-score.won{background:#daf5e6;color:#156342}.detail-score.lost{background:#ffe2e4;color:#a02035}
</style>
</head>
<body>
<header class="top"><div class="shell"><div class="toprow"><div class="logo"><span class="mark" aria-hidden="true">●</span> Pétanque Live</div><span class="top-status" id="liveIndicator"><span class="live-dot"></span> SUIVI PUBLIC</span></div><h1 id="title" class="comp">Chargement de la compétition…</h1><div id="metadata" class="sub"></div><div class="stats"><div class="stat"><strong id="statTeams">—</strong><small id="statTeamsLabel">Équipes</small></div><div class="stat"><strong id="statRound">—</strong><small id="statRoundLabel">Tours suisses</small></div><div class="stat"><strong id="statMatches">—</strong><small id="statMatchesLabel">Résultats validés</small></div></div><div id="liveTimer" class="live-timer" hidden aria-label="Chronomètre de compétition"><div class="live-timer-header"><span class="live-timer-label" id="liveTimerLabel">Chronomètre</span><span id="liveTimerStatus" class="live-timer-state">En attente</span></div><strong class="live-timer-clock" id="liveTimerClock">00:00</strong><div class="live-timer-bar"><div class="live-timer-fill" id="liveTimerFill"></div></div></div></div></header>
<main>
<div class="searchbox"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input type="search" id="search" aria-label="Rechercher une équipe" placeholder="Rechercher une équipe ou un joueur…" autocomplete="off"></div><div id="searchResults" class="search-results hide"></div>
<nav class="nav" aria-label="Rubriques"><button type="button" data-tab="suisses" class="active">Tours suisses</button><button type="button" data-tab="classement">Classement</button><button type="button" data-tab="finales">Phases finales</button><button type="button" data-tab="equipes">Équipes</button></nav>
<section id="content" class="panel" aria-live="polite"><div class="msg">Chargement des résultats…</div></section>
<div class="foot"><div id="status" role="status">Connexion aux résultats…</div><button class="refresh" id="refresh" type="button">↻ Actualiser</button><p>Résultats publiés par l'organisateur · Consultation uniquement</p></div>
</main><script src="config.js"></script><script src="app.js"></script></body></html>
